<div class="video-grid-container">
    <div class="video-card" ng-repeat="video in $ctrl.list">
        <a ng-href="{{video.url}}" target="_blank" class="card-link">

            <div class="thumbnail-container">
                <!-- YouTube Static Image Engine -->

                <img ng-src="/thumbnails/{{video.sm}}/{{video.thumbnail}}.jpg" 
                     alt="Video dynamic placeholder"  ng-if2="video.sm === 'youtube'">
                
                 <svg class="play-button" viewBox="0 0 200 200">
                <!--<circle cx="100" cy="100" r="90" fill="rgba(0,0,0,0.5)" stroke="none" stroke-width="10"></circle>-->
                <polygon points="70,55 70,145 145,100" fill="#fff" stroke="rgba(0,0,0,0.9)"></polygon>
                </svg>

                <!-- Instagram Layout Symbol Placeholder Frame -->
<!--                <div class="insta-placeholder" ng-if="video.sm === 'instagram'">
                    <span class="icon">🎬</span>
                    <p>Instagram Reel</p>
                </div>-->

                <!--<span class="platform-badge" ng-class="video.sm">{{video.sm}}</span>-->
                <span class="platform-badge" ng-class="video.sm">{{video.order}}</span>

               
            </div>


        </a>
    </div>
</div>
